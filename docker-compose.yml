services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_bot_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hotel_bot
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: